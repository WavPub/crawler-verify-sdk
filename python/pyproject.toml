[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavpub-crawler-verify"
version = "1.0.0"
description = "Official Python SDK for verifying WavPub (声湃) crawler requests (0-RTT Ed25519 JWKS offline & online verification)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
